<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="sac-favicon-title">
  <title id="sac-favicon-title">Southern AI Consulting</title>
  <!-- Badge form: the mark reversed out of navy. A filled tile beats a bare
       stroke in a browser tab, because the tab strip is a different colour in
       every theme and the mark keeps its own background either way.
       Copper is lifted to #D99A6C - #B26B3F on navy is only 1.9:1 and goes
       muddy by 16px. -->
  <rect width="64" height="64" rx="14" fill="#10233A"/>
  <path d="M 48.2 12 C 21.2 12, 21.2 26, 32 32 C 42.8 38, 42.8 52, 15.8 52"
        fill="none" stroke="#D99A6C" stroke-width="8.5"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
