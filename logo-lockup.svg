<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 64" width="300" height="64" role="img" aria-labelledby="sac-lockup-title">
  <title id="sac-lockup-title">Southern AI Consulting</title>
  <!-- Horizontal lockup for email signatures, letterhead, and business cards.
       Uses Georgia (ubiquitous on macOS/Windows); convert text to outlines
       before sending to a print vendor. -->
  <g>
    <path d="M 44 12 C 24 12, 24 30, 32 32 C 40 34, 40 52, 20 52"
          fill="none" stroke="#B26B3F" stroke-width="5.5"
          stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="44" cy="12" r="3.6" fill="#10233A"/>
    <circle cx="32" cy="32" r="3.6" fill="#10233A"/>
    <circle cx="20" cy="52" r="3.6" fill="#10233A"/>
  </g>
  <text x="72" y="28" font-family="Georgia, 'Times New Roman', serif"
        font-size="19" letter-spacing="0.5" fill="#10233A">SOUTHERN AI</text>
  <text x="72" y="50" font-family="Georgia, 'Times New Roman', serif"
        font-size="19" letter-spacing="0.5" fill="#10233A">CONSULTING</text>
</svg>
