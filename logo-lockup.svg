<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 224 64" width="224" height="64" role="img" aria-labelledby="sac-lockup-title">
  <title id="sac-lockup-title">Southern AI Consulting</title>
  <!-- Horizontal lockup for email signatures, letterhead, and slides.
       Uses live Georgia text, which is ubiquitous on macOS and Windows but is
       NOT safe to hand a print vendor - a missing Georgia silently substitutes
       another face. For anything printed use brand/logo-horizontal-*.svg or
       .pdf, where the wordmark is real vector outlines.

       Layout: mark ink ends at x=52.45, so text starts 16 units later at 68.
       Baselines 27.6 / 49.6 put the wordmark's cap-to-baseline block
       (14.45 -> 49.6, centre 32.03) on the mark's centre line (32). -->
  <path d="M 48.2 12 C 21.2 12, 21.2 26, 32 32 C 42.8 38, 42.8 52, 15.8 52"
        fill="none" stroke="#B26B3F" stroke-width="8.5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#10233A" font-family="Georgia, 'Times New Roman', serif"
     font-size="19" font-weight="700" letter-spacing="0.5">
    <text x="68" y="27.6">SOUTHERN AI</text>
    <text x="68" y="49.6">CONSULTING</text>
  </g>
</svg>
