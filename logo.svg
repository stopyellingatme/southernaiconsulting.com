<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="sac-logo-title">
  <title id="sac-logo-title">Southern AI Consulting</title>
  <!-- River-bend S: the Alabama River bend, doubling as the S in Southern.
